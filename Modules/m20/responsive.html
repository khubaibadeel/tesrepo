<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Responsive Design</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

      <img src="https://picsum.photos/300/200?3" alt="Headphones" />

    </div>
