<!DOCTYPE html>
<html>
<head>
  <title>CSS Grid Demo</title>
  <style>
    .container {
      display: grid;
      grid-template-rows: 2fr 2fr 1fr;
      gap: 20px;
    }

    .box {
      background: steelblue;
      color: white;
      padding: 30px;
      font-size: 30px;
      text-align: center;
      border: 1px solid black;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>
</body>
</html>
