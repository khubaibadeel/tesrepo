<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    .container {
      display: grid;

      grid-template-columns: 1fr 3fr;

      gap: 10px;
    }

    .header {
      grid-column: 1/3;

      background: #2196f3;

      padding: 20px;

      color: white;
    }

    .sidebar {
      background: #4caf50;

      padding: 20px;

      color: white;
    }

    .content {
        background: #ff9800;

      padding: 20px;

      color: white;
    }

    .footer {
      grid-column: 1/3;

      background: #333;

      padding: 20px;

      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Header</div>

    <div class="sidebar">Sidebar</div>

    <div class="content">Content</div>

    <div class="footer">Footer</div>
  </div>
</body>
</html>
