<!DOCTYPE html>
<html>
<head>
  <style>
    .parent {
      position: relative;
      width: 300px;
      height: 200px;
      background: lightgray;
    }

    .child {
      position: absolute;

      top: 20px;
      right: 20px;

      width: 80px;
      height: 80px;

      background: red;
      color: white;
    }

    .fixed-btn {
      position: fixed;

      bottom: 20px;
      right: 20px;

      background: green;
      color: white;
      padding: 10px;
    }
  </style>
</head>

<body>
  <div class="parent">
    Parent
    <div class="child">Absolute</div>
  </div>

  <div class="fixed-btn">Help</div>
</body>
</html>
