<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="bg-red-500 text-white p-4">Red Box</div>
    <div class="bg-green-500 text-white p-4 mt-4">Green Box</div>
    <div class="bg-yellow-500 text-white p-4 mt-4">Yellow Box</div>

    <!-- The text 500 inside the class name represents the shade of the color being used. You can change it to 100, 200, 300, 400, 600, 700, 800, or 900 to see different shades of the color. -->

    <!-- The text-white inside the class name represents the text color being used. You can change it to text-black, text-gray, text-blue, etc. to see different text colors. -->

    <!-- The text p-4 at the end of the class name represents the padding being used. You can change it to p-1, p-2, p-3, p-5, p-6, p-7, p-8, or p-9 to see different padding sizes. -->

    <!-- The text mt-4 inside the last two class names represents the margin-top being used. You can change it to mt-1, mt-2, mt-3, mt-5, mt-6, mt-7, mt-8, or mt-9 to see different margin-top sizes. -->


</body>
</html>
