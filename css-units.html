<!DOCTYPE html>
<html>
  <head>
    <title>CSS Units</title>
    <style>
      .box1 {
        width: 200px;
        height: 100px;
        background: tomato;
        margin-bottom: 10px;
      }

      .box2 {
        width: 50%;
        height: 100px;
        background: skyblue;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 2rem;
      }

      .hero {
        height: 100vh;
        background: lightgreen;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>CSS Units Example</h1>

    <div class="box1">200px Width</div>

    <div class="box2">50% Width</div>

    <div class="hero">100vh Height</div>
  </body>
</html>
